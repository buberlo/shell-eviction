[package]
name = "shell-eviction"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Import shell history, score directory dwell time, and issue eviction notices."
license = "MIT"
readme = "README.md"
keywords = ["cli", "shell", "history", "productivity"]
categories = ["command-line-utilities"]

[lib]
name = "shell_eviction"
path = "src/lib.rs"

[[bin]]
name = "shell-eviction"
path = "src/main.rs"
test = true

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
regex = "1.10"
dirs = "5.0"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"